<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆速トイレナビ - IBS緊急回避システム</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>

<body>

    <div class="app-container">

        <!-- =========================
             ヘッダー
        ========================== -->
        <header>
            🚻 爆速トイレナビ
        </header>

        <!-- =========================
             ナビゲーション
        ========================== -->
        <section class="navi-section">

            <div class="alert-badge">
                最寄りトイレを検索中...
            </div>

            <div class="huge-arrow" id="direction-arrow">
                ⬇
            </div>

            <div class="distance-text">
                45<span>m</span>
            </div>

            <div class="target-place">
                📍 渋谷東口ビル 2F公衆トイレ
            </div>

        </section>

        <!-- =========================
             地図
        ========================== -->
        <section class="map-area">
            <div id="map"></div>
        </section>

        <!-- =========================
             トイレ情報
        ========================== -->
        <section class="status-section">

            <div class="info-card">

                <div class="info-title">
                    🚽 設備
                </div>

                <div class="info-value">
                    暖房便座・ウォシュレット
                </div>

            </div>

            <div class="info-card">

                <div class="info-title">
                    ⭐ 清潔度（ユーザー平均）
                </div>

                <div class="info-value">
                    <span class="stars">★★★☆☆</span>
                </div>

            </div>

            <div class="info-card">

                <div class="info-title">
                    ⏰ 推定到着時間
                </div>

                <div class="info-value" id="arrival-time">
                    計算中...
                </div>

            </div>

        </section>

        <!-- =========================
             レビュー
        ========================== -->
        <footer>

            <p class="review-title">
                このトイレを評価してください
            </p>

            <div class="star-rating">

                <span class="star-input" data-value="1">☆</span>
                <span class="star-input" data-value="2">☆</span>
                <span class="star-input" data-value="3">☆</span>
                <span class="star-input" data-value="4">☆</span>
                <span class="star-input" data-value="5">☆</span>

            </div>

        </footer>

    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
